name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Go (vet + lint + test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "File belum di-gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

      # Race detector butuh cgo + toolchain C. ubuntu-latest sudah punya gcc,
      # jadi ini jalur CI resmi untuk `-race` (mesin dev Windows tidak punya
      # compiler C — di sana pakai `make test-race-docker`).
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -cover ./...
