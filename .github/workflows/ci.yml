name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Go (vet + lint + test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "File belum di-gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      # Race detector butuh cgo + toolchain C. ubuntu-latest sudah punya gcc,
      # jadi ini jalur CI resmi untuk `-race` (mesin dev Windows tidak punya
      # compiler C — di sana pakai `make test-race-docker`).
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -cover ./...

  frontend:
    name: Frontend Nuxt (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` menjalankan script `postinstall` (nuxt prepare), yang men-generate
      # `.nuxt/` — termasuk `.nuxt/eslint.config.mjs` yang di-import
      # `eslint.config.mjs`, dan tipe auto-import yang dibutuhkan vue-tsc.
      # Tanpa langkah ini lint & typecheck dua-duanya gagal resolve.
      - name: Install dependencies
        run: npm ci

      # --max-warnings=0: warning dibiarkan menumpuk akan berhenti dibaca orang,
      # dan aturan seperti vue/no-v-html memang muncul sebagai warning padahal
      # menandai risiko nyata. Pengecualian yang disengaja ditulis eksplisit
      # sebagai `eslint-disable-next-line` beserta alasannya di kode.
      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build
