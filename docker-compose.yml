services:
  postgres:
    image: postgres:16-alpine
    container_name: rajaku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rajaku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rajaku_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rajaku_printing}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rajaku} -d ${POSTGRES_DB:-rajaku_printing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: rajaku-backend
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - ./.docker-data/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: rajaku-frontend
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - backend

  worker:
    build:
      context: ./services/notification-worker
    container_name: rajaku-worker
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./.docker-data/worker/session:/app/session
      - ./.docker-data/worker/wa-state.json:/app/wa-state.json


